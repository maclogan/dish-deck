# Dish Deck on Kubernetes (any distribution: MicroK8s, k3s, kubeadm, ...).
#
# All settings and secrets come from your .env file, stored as a Secret:
#   kubectl create namespace dish-deck
#   kubectl -n dish-deck create secret generic dish-deck-env --from-env-file=.env
#   kubectl apply -f deploy/kubernetes.yaml
#
# To update to the newest image (after a push to main has finished building):
#   kubectl -n dish-deck rollout restart deploy/dish-deck
#
# To change settings later, recreate the secret and restart:
#   kubectl -n dish-deck create secret generic dish-deck-env --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n dish-deck rollout restart deploy/dish-deck
#
# In .env, point MEALIE_URL at Mealie's in-cluster address, e.g.
#   MEALIE_URL=http://mealie.mealie.svc.cluster.local:9000   (service "mealie" in namespace "mealie")
#
# The "dish-deck-data" volume keeps the recipe cache and the household's skipped/saved history
# between restarts and updates. It uses the cluster's default storage class (on MicroK8s, enable it
# with `microk8s enable hostpath-storage`).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dish-deck-data
  namespace: dish-deck
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dish-deck
  namespace: dish-deck
  labels:
    app: dish-deck
  annotations:
    # Optional auto-updates with Keel (https://keel.sh). Ignored if Keel isn't installed.
    # Keel checks GHCR every minute and rolls out a new :latest as soon as it's published.
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
spec:
  replicas: 1
  # One pod at a time owns the data volume (the old pod stops before the new one starts).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dish-deck
  template:
    metadata:
      labels:
        app: dish-deck
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: dish-deck
          image: ghcr.io/maclogan/dish-deck:latest
          # Always: every restart checks GHCR for a newer :latest, so updating is just
          #   kubectl -n dish-deck rollout restart deploy/dish-deck
          # To pin a release instead, use e.g. ghcr.io/maclogan/dish-deck:0.2.0
          # If you build the image yourself and import it into the cluster
          # (e.g. `microk8s images import`), set image: dish-deck:local and imagePullPolicy: Never.
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: dish-deck-env
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dish-deck-data
---
apiVersion: v1
kind: Service
metadata:
  name: dish-deck
  namespace: dish-deck
spec:
  selector:
    app: dish-deck
  ports:
    - name: http
      port: 8080
      targetPort: http
