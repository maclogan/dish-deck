# Dish Deck with Docker Compose.
#   cp example.env .env   # then fill it in
#   docker compose up -d
#
# If Mealie runs in another Compose project, put both on a shared network (see README)
# or set MEALIE_URL in .env to an address the container can reach.
services:
  dish-deck:
    image: ghcr.io/maclogan/dish-deck:latest
    # To build from source instead of pulling the published image:
    # build: .
    container_name: dish-deck
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      # Recipe cache and household history (kept between updates).
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional free search fallback: `docker compose --profile search up -d`, then in .env set
  #   SEARXNG_URL=http://searxng:8080
  searxng:
    image: docker.io/searxng/searxng:latest
    profiles: [search]
    container_name: searxng
    environment:
      SEARXNG_SECRET: change-me-to-a-long-random-string
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
